name: CI

on:
  pull_request:
  workflow_dispatch:

# Cancel an older run when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tokens.css is up to date
        run: npm run tokens:check

      - name: Lint and format check
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (incl. WCAG contrast checks)
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook
